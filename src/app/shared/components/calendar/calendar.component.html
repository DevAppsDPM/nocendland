<div class="calendar-container">
  <div class="header">
    <button (click)="prevMonth()">&#9664;</button>
    <span>{{ monthNames[currentMonth] }} {{ currentYear }}</span>
    <button (click)="nextMonth()">&#9654;</button>
  </div>

  <div class="days-container">
    @for (day of weekDays; track day) {
      <div class="day-header">{{ day }}</div>
    }

    <!-- Agrega días vacíos si el mes no empieza en lunes -->
    @for (empty of getEmptyDays(); track empty) {
      <div class="day rounded-full"></div>
    }

    <!-- Muestra los días del mes -->
    @for (day of daysInMonth; track day) {
      <div class="day rounded-full" [class]="isSelectedDay(day) ? 'bg-indigo-950' : ''" (click)="onDayClick(day)">
        {{ day }}
      </div>
    }
  </div>
</div>
