<section class="data-list">
  <header class="data-list__tools ui-card">
    <label class="data-list__search">
      <span class="sr-only">Buscar</span>
      <svg class="ui-icon" aria-hidden="true"><use href="icons/atlas-icons.svg#search"/></svg>
      <input
        class="data-list__search-input"
        type="search"
        placeholder="Buscar"
        [ngModel]="listingService.filter()"
        (ngModelChange)="listingService.setFilter($event)"
      >
      @if (listingService.filter()) {
        <button class="ui-icon-button" type="button" aria-label="Limpiar búsqueda" (click)="listingService.clearFilter()">
          <svg class="ui-icon" aria-hidden="true"><use href="icons/atlas-icons.svg#close"/></svg>
        </button>
      }
    </label>

    @if (config().actions?.reload) {
      <button class="ui-icon-button" type="button" aria-label="Actualizar lista" (click)="config().actions!.reload!()">
        <svg class="ui-icon" aria-hidden="true"><use href="icons/atlas-icons.svg#refresh"/></svg>
      </button>
    }

    @if (config().loading?.()) {
      <div class="data-list__loading" role="progressbar" aria-label="Actualizando lista"></div>
    }
  </header>

  <div class="data-list__content">
    @if (listingService.filteredItems().length === 0) {
      <p class="data-list__empty">No hay elementos</p>
    } @else {
      <ul class="data-list__items" [attr.aria-label]="config().columnConfig.title">
        @for (item of listingService.filteredItems(); track item; let index = $index) {
          <li>
            <button
              class="data-list__item"
              type="button"
              [class.data-list__item--selected]="listingService.isSelected(item)"
              [attr.aria-pressed]="multiselect() ? listingService.isSelected(item) : null"
              (click)="activate(item, index)"
            >
              @if (config().columnConfig.image) {
                <img
                  [src]="getNestedProperty(item, config().columnConfig.image!) || defaultImagePath"
                  [alt]="getNestedProperty(item, config().columnConfig.title)"
                >
              }
              <span class="data-list__copy">
                <strong>{{ getNestedProperty(item, config().columnConfig.title) }}</strong>
                @for (line of config().columnConfig.lines; track line) {
                  <small>{{ getNestedProperty(item, line) }}</small>
                }
              </span>
              @if (multiselect()) {
                <svg class="data-list__check ui-icon" aria-hidden="true">
                  <use [attr.href]="'icons/atlas-icons.svg#' + (listingService.isSelected(item) ? 'check_circle' : 'radio_button_unchecked')"/>
                </svg>
              } @else {
                <span class="data-list__arrow" aria-hidden="true">→</span>
              }
            </button>
          </li>
        }
      </ul>
    }
  </div>

  @if (config().activateConfirm && multiselect()) {
    <footer class="data-list__footer">
      <button
        class="ui-button"
        type="button"
        [disabled]="listingService.selectedItems().length === 0"
        (click)="confirm(listingService.selectedItems())"
      >
        <svg class="ui-icon" aria-hidden="true"><use [attr.href]="'icons/atlas-icons.svg#' + (config().iconConfirm || 'done')"/></svg>
        Confirmar selección
      </button>
    </footer>
  }
</section>
