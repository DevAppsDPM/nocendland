<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title>{{ config().title }}</mat-card-title>
      <div matCardAvatar>{{ math.getPercentage(config().value, config().objective).toFixed(0) }}%</div>
    </mat-card-title-group>
  </mat-card-header>
  <article class="progress-container">
    <div>{{ config().value }}</div>
    <mat-progress-bar [value]="math.getPercentage(config().value, config().objective)"/>
    <div>{{ config().objective }}</div>
  </article>
</mat-card>
