@if (footerService.showingFooter()) {
  <nav class="area-navigation" aria-label="Navegación de Nutrición">
    @for (button of footerService.buttons(); track button.text) {
      <button
        class="area-navigation__item"
        type="button"
        [class.area-navigation__item--active]="button.active"
        [attr.aria-current]="button.active ? 'page' : null"
        (click)="footerService.onClickButton(button)"
      >
        <svg class="ui-icon" aria-hidden="true"><use [attr.href]="'icons/atlas-icons.svg#' + button.icon"/></svg>
        <span>{{ button.text }}</span>
      </button>
    }
  </nav>
}
