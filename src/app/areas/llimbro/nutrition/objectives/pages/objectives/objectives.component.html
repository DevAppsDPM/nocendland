<header class="col-span-2 flex items-center">
  <div class="text-2xl w-full">{{ text.objectives.name }}</div>
  <button mat-icon-button (click)="openDialogObjectiveConfig()"><mat-icon>settings</mat-icon></button>
</header>

<article class="grid gap-1 p-1">
  @for (progressConfig of progressConfigList(); track $index) {
    <app-progress-viewer [config]="progressConfig"/>
  }
</article>
